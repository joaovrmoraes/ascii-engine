name: Publish gallery and map demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v6.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pages:build
      - name: Publish hosting branch
        id: publication
        run: node scripts/publish-pages.mjs
      - name: Request Pages build
        if: steps.publication.outputs.changed == 'true'
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
