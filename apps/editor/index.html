<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Engine</title>
    <style>
      html, body { margin: 0; height: 100%; background: #09080e; color: #c8c4bd; font: 12px ui-monospace, monospace; }
      #app { position: fixed; inset: 0; }
      #status { position: fixed; left: 12px; bottom: 10px; color: #d3b27c; pointer-events: none; }
      #panel { position: fixed; top: 10px; right: 10px; display: grid; gap: 6px; padding: 10px 12px; background: #09080ecc; border: 1px dashed #3a3640; color: #c8c4bd; }
      #panel label { display: grid; grid-template-columns: 64px 1fr 44px; align-items: center; gap: 6px; }
      #panel select, #panel button { font: inherit; color: inherit; background: #141219; border: 1px solid #3a3640; padding: 2px 4px; }
      #panel select { grid-column: 2 / 4; }
      #panel button { cursor: pointer; }
      #panel output { color: #d3b27c; }
      #panel label.file { display: block; text-align: center; cursor: pointer; border: 1px solid #3a3640; padding: 2px 4px; background: #141219; }
      @media (max-width: 640px) { #panel { left: 10px; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status"></div>
    <div id="panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
