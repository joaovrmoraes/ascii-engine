[package]
name = "ascii-engine-editor"
version = "0.0.0"
description = "ASCII Engine — editor"
edition = "2021"

[lib]
name = "ascii_engine_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
